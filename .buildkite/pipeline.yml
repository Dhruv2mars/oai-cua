# Buildkite CI (replaces .github/workflows/check.yml now that this repo lives on Entire).
# The plugin is macOS-only and its tests need macOS, so this runs on a hosted macOS queue (like the old macos-latest job).
# Checkout comes from the Entire plugin Buildkite adds to every job.
steps:
  - label: ":apple: check"
    key: check
    agents: { queue: macos-medium }
    timeout_in_minutes: 20
    command: |
      command -v node >/dev/null || brew install --quiet node@22
      command -v bun >/dev/null || { curl -fsSL https://bun.sh/install | bash >/dev/null; }
      export PATH="$$HOME/.bun/bin:/opt/homebrew/opt/node@22/bin:$$PATH"
      node --version && bun --version
      bun run check
